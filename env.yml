name: picnic
channels:
  - https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/public/
  - conda-forge
# Update this ~yearly; last updated Jan 2024
dependencies:
  - python=3.12
  # Needed for svgo and bids-validator; consider moving to deno
  - nodejs
  # Intel Math Kernel Library for numpy
  - mkl
  - mkl-service
  # git-annex for templateflow users with DataLad superdatasets
  - git-annex=*=alldep*
  # Base scientific python stack; required by FSL, so pinned here
  - numpy=2.5
  - scipy=1.18
  - matplotlib=3.11
  - pandas=3.0
  - h5py=3.16.0
  # Needed for PICNIC
  - nibabel=5.4.2
  - nilearn=0.14.1
  # Dependencies compiled against numpy, best to stick with conda
  - nitime=0.12.1
  - scikit-image=0.26.0
  - scikit-learn=1.9.1
  # Utilities
  # The latest graphviz in pypi is 0.21 from 2025-06-15.
  # The latest graphviz in conda-forge is 14.1.2 from 2026-01-26
  - graphviz=14.1.2
  # Pandoc is also a different version in conda-forge from pypi
  - pandoc=3.8
  # Workflow dependencies: ANTs
  # The latest ants in conda-forge is 2.6.5 from 2026-01-19 and looks like ANTs
  # In pypi, ants is a python 2.7/django 1.8 pile from 2017. Not Adv Norm Tools
  - ants=2.6.5
  # Workflow dependencies: FSL (versions updated 1/21/2025)
  - fsl-bet2=2111.9
  - fsl-flirt=2111.4
  - fsl-fast4=2111.3
  - fsl-fugue=2603.0
  - fsl-mcflirt=2111.0
  - fsl-miscmaths=2412.7
  - fsl-topup=2203.6
  - pip
  - pip:
    - -r requirements.txt
variables:
  FSLOUTPUTTYPE: NIFTI_GZ
